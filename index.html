<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="재고조사">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>해운대 재고조사</title>
<link rel="stylesheet" href="app.css?v=9">
</head>
<body>
<div class="app" id="app">
  <header class="nav" id="nav"></header>
  <main class="content" id="content">
    <div id="scannerHost" hidden></div>
    <div id="view"></div>
  </main>
  <nav class="tabbar" id="tabbar" aria-label="메뉴" hidden>
    <button class="tab" data-tab="scan">
      <svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 8V5.5A2.5 2.5 0 0 1 5.5 3H8M18 3h2.5A2.5 2.5 0 0 1 23 5.5V8M23 18v2.5a2.5 2.5 0 0 1-2.5 2.5H18M8 23H5.5A2.5 2.5 0 0 1 3 20.5V18"/><path d="M8 8v10M11 8v10M14.5 8v10M18 8v10" stroke-width="1.5"/></svg>
      스캔
    </button>
    <button class="tab" data-tab="audit">
      <svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4.5" width="16" height="18" rx="2.5"/><path d="M9.5 4.5V3.5h7v1"/><path d="M9 11.5l1.8 1.8 3.4-3.4M9 17.5h8"/></svg>
      재고조사
    </button>
    <button class="tab" data-tab="recent">
      <svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="13" r="9.5"/><path d="M13 7.5V13l3.5 2.5"/></svg>
      최근 스캔
    </button>
    <button class="tab" data-tab="log">
      <svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3.5" width="18" height="19" rx="3"/><path d="M8.5 9.5l1.5 1.5 3-3M8.5 16.5l1.5 1.5 3-3M15.5 10h3M15.5 17h3"/></svg>
      체크 기록
      <span class="badge" id="badge" hidden></span>
    </button>
    <button class="tab" data-tab="settings">
      <svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="13" cy="13" r="9.5"/><circle cx="13" cy="10.5" r="3.2"/><path d="M6.8 19.6c1.4-2.2 3.6-3.4 6.2-3.4s4.8 1.2 6.2 3.4" stroke-linecap="round"/></svg>
      설정
    </button>
  </nav>
  <div class="backdrop" id="backdrop" hidden></div>
  <section class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></section>
  <div class="toast" id="toast" hidden><div id="toastText"></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="app.js?v=9"></script>
</body>
</html>
